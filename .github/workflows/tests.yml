name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.lock
      - run: python -m copilot download-runtime
      - run: python -m unittest tests.test_copilot_runtime -v
        env:
          ODIN_TEST_COPILOT_RUNTIME: '1'
      - run: python test_odin.py
      - run: npm ci && npm run vendor
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          ODIN_TEST_PYTHON: python